<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="auto" style="border-radius: 12px; background: #0e1420; border: 1px solid rgba(0, 255, 135, 0.25); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="jj_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="jj_panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151e2e" />
      <stop offset="100%" stop-color="#101724" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="540" height="34" fill="#131b29"/>
  <rect x="0" y="0" width="540" height="2" fill="url(#jj_accent)"/>
  <text x="16" y="22" fill="#ffffff" font-size="12.5" font-weight="800" letter-spacing="1">🏃 JUMPING JACK TECHNIQUE GUIDE</text>
  <text x="524" y="22" fill="#00ff87" font-size="11" font-weight="700" text-anchor="end">AI TARGET: &gt; 130° ARM SWEEP</text>

  <!-- Left: In Position -->
  <rect x="14" y="44" width="248" height="202" rx="8" fill="url(#jj_panel)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <rect x="24" y="54" width="115" height="20" rx="4" fill="rgba(0, 210, 255, 0.15)"/>
  <text x="29" y="68" fill="#00d2ff" font-size="10" font-weight="800" letter-spacing="0.8">STEP 1: FEET TOGETHER</text>

  <g transform="translate(145, 75)">
    <circle cx="0" cy="18" r="9" fill="#00d2ff"/>
    <line x1="0" y1="27" x2="0" y2="78" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Arms at sides (<45°) -->
    <line x1="0" y1="38" x2="-14" y2="82" stroke="#60efff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="38" x2="14" y2="82" stroke="#60efff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Legs together -->
    <line x1="0" y1="78" x2="-5" y2="148" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="5" y2="148" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-30" y1="150" x2="30" y2="150" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <text x="24" y="96" fill="#e6edf3" font-size="10.5" font-weight="600">• Feet together, knees soft</text>
  <text x="24" y="114" fill="#e6edf3" font-size="10.5" font-weight="600">• Arms hanging at sides</text>
  <text x="24" y="132" fill="#e6edf3" font-size="10.5" font-weight="600">• Shoulders relaxed</text>
  <text x="24" y="150" fill="#e6edf3" font-size="10.5" font-weight="600">• Ready to jump wide</text>
  <rect x="24" y="214" width="228" height="22" rx="4" fill="rgba(255,255,255,0.04)"/>
  <text x="138" y="229" fill="#8b949e" font-size="9.5" text-anchor="middle">Setup: In position, arms &lt; 45°</text>

  <!-- Right: Star Jump Out -->
  <rect x="278" y="44" width="248" height="202" rx="8" fill="url(#jj_panel)" stroke="rgba(0,255,135,0.3)" stroke-width="1"/>
  <rect x="288" y="54" width="135" height="20" rx="4" fill="rgba(0, 255, 135, 0.15)"/>
  <text x="293" y="68" fill="#00ff87" font-size="10" font-weight="800" letter-spacing="0.8">STEP 2: ARMS OVERHEAD</text>

  <g transform="translate(405, 75)">
    <circle cx="0" cy="18" r="9" fill="#00ff87"/>
    <line x1="0" y1="27" x2="0" y2="78" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Arms raised overhead (>130°) -->
    <line x1="0" y1="38" x2="-26" y2="2" stroke="#00ff87" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="38" x2="26" y2="2" stroke="#00ff87" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs jumped wide -->
    <line x1="0" y1="78" x2="-28" y2="148" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="28" y2="148" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-45" y1="150" x2="45" y2="150" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Angle badge -->
    <rect x="-17" y="-14" width="34" height="15" rx="3" fill="#111827" stroke="#00ff87" stroke-width="1"/>
    <text x="0" y="-3" fill="#00ff87" font-size="8.5" font-weight="800" text-anchor="middle">&gt;130°</text>
  </g>
  <text x="288" y="96" fill="#e6edf3" font-size="10.5" font-weight="600">• Jump feet out wide</text>
  <text x="288" y="114" fill="#e6edf3" font-size="10.5" font-weight="600">• Arms clap/meet overhead</text>
  <text x="288" y="132" fill="#e6edf3" font-size="10.5" font-weight="600">• Land softly on balls of feet</text>
  <text x="288" y="150" fill="#e6edf3" font-size="10.5" font-weight="600">• Spring back into center</text>
  <rect x="288" y="214" width="228" height="22" rx="4" fill="rgba(0,255,135,0.08)"/>
  <text x="402" y="229" fill="#00ff87" font-size="9.5" font-weight="700" text-anchor="middle">Execution: Rapid rhythmic cycling</text>
</svg>