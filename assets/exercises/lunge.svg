<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="auto" style="border-radius: 12px; background: #0e1420; border: 1px solid rgba(0, 255, 135, 0.25); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="lu_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00ff87" />
    </linearGradient>
    <linearGradient id="lu_panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151e2e" />
      <stop offset="100%" stop-color="#101724" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="540" height="34" fill="#131b29"/>
  <rect x="0" y="0" width="540" height="2" fill="url(#lu_accent)"/>
  <text x="16" y="22" fill="#ffffff" font-size="12.5" font-weight="800" letter-spacing="1">⚡ LUNGE TECHNIQUE GUIDE</text>
  <text x="524" y="22" fill="#00ff87" font-size="11" font-weight="700" text-anchor="end">AI TARGET: &lt; 90° FRONT KNEE</text>

  <!-- Left: Standing Stance -->
  <rect x="14" y="44" width="248" height="202" rx="8" fill="url(#lu_panel)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <rect x="24" y="54" width="125" height="20" rx="4" fill="rgba(0, 210, 255, 0.15)"/>
  <text x="29" y="68" fill="#00d2ff" font-size="10" font-weight="800" letter-spacing="0.8">STEP 1: UPRIGHT STANCE</text>

  <g transform="translate(145, 75)">
    <circle cx="0" cy="18" r="9" fill="#00d2ff"/>
    <line x1="0" y1="27" x2="0" y2="78" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="42" x2="0" y2="68" stroke="#60efff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="-6" y2="148" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="6" y2="148" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-6" y1="148" x2="4" y2="148" stroke="#00ff87" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="148" x2="16" y2="148" stroke="#00ff87" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="150" x2="30" y2="150" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <text x="24" y="96" fill="#e6edf3" font-size="10.5" font-weight="600">• Feet hip-width apart</text>
  <text x="24" y="114" fill="#e6edf3" font-size="10.5" font-weight="600">• Hands on hips or chest</text>
  <text x="24" y="132" fill="#e6edf3" font-size="10.5" font-weight="600">• Upright neutral spine</text>
  <text x="24" y="150" fill="#e6edf3" font-size="10.5" font-weight="600">• Prepare to step forward</text>
  <rect x="24" y="214" width="228" height="22" rx="4" fill="rgba(255,255,255,0.04)"/>
  <text x="138" y="229" fill="#8b949e" font-size="9.5" text-anchor="middle">Setup: Balance centered, eyes front</text>

  <!-- Right: Stepped Lunge Depth -->
  <rect x="278" y="44" width="248" height="202" rx="8" fill="url(#lu_panel)" stroke="rgba(0,255,135,0.3)" stroke-width="1"/>
  <rect x="288" y="54" width="135" height="20" rx="4" fill="rgba(0, 255, 135, 0.15)"/>
  <text x="293" y="68" fill="#00ff87" font-size="10" font-weight="800" letter-spacing="0.8">STEP 2: 90° DUAL BEND</text>

  <g transform="translate(395, 95)">
    <circle cx="0" cy="8" r="9" fill="#00ff87"/>
    <line x1="0" y1="17" x2="0" y2="60" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Front Leg: Hip to knee forward -->
    <line x1="0" y1="60" x2="32" y2="64" stroke="#00ff87" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Front Shin: Knee to foot -->
    <line x1="32" y1="64" x2="32" y2="128" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="128" x2="48" y2="128" stroke="#00ff87" stroke-width="3" stroke-linecap="round"/>
    <!-- Back Leg: Hip to knee down -->
    <line x1="0" y1="60" x2="-26" y2="105" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Back Shin: Knee to ball of foot -->
    <line x1="-26" y1="105" x2="-48" y2="128" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-54" y1="128" x2="-44" y2="128" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Ground -->
    <line x1="-60" y1="130" x2="60" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Angle badge on front knee -->
    <rect x="36" y="68" width="30" height="15" rx="3" fill="#111827" stroke="#00ff87" stroke-width="1"/>
    <text x="51" y="79" fill="#00ff87" font-size="8.5" font-weight="800" text-anchor="middle">&lt;90°</text>
  </g>
  <text x="288" y="96" fill="#e6edf3" font-size="10.5" font-weight="600">• Big step forward</text>
  <text x="288" y="114" fill="#e6edf3" font-size="10.5" font-weight="600">• Both knees reach 90° bend</text>
  <text x="288" y="132" fill="#e6edf3" font-size="10.5" font-weight="600">• Front knee over ankle</text>
  <text x="288" y="150" fill="#e6edf3" font-size="10.5" font-weight="600">• Drive through front heel</text>
  <rect x="288" y="214" width="228" height="22" rx="4" fill="rgba(0,255,135,0.08)"/>
  <text x="402" y="229" fill="#00ff87" font-size="9.5" font-weight="700" text-anchor="middle">Execution: Step back smoothly to complete</text>
</svg>