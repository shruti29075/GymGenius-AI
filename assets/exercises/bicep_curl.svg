<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="auto" style="border-radius: 12px; background: #0e1420; border: 1px solid rgba(0, 255, 135, 0.25); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bc_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>
    <linearGradient id="bc_panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151e2e" />
      <stop offset="100%" stop-color="#101724" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="540" height="34" fill="#131b29"/>
  <rect x="0" y="0" width="540" height="2" fill="url(#bc_accent)"/>
  <text x="16" y="22" fill="#ffffff" font-size="12.5" font-weight="800" letter-spacing="1">💥 BICEP CURL TECHNIQUE GUIDE</text>
  <text x="524" y="22" fill="#00ff87" font-size="11" font-weight="700" text-anchor="end">AI TARGET: &lt; 50° PEAK CONTRACTION</text>

  <!-- Left: Arm Extended Start -->
  <rect x="14" y="44" width="248" height="202" rx="8" fill="url(#bc_panel)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <rect x="24" y="54" width="125" height="20" rx="4" fill="rgba(0, 210, 255, 0.15)"/>
  <text x="29" y="68" fill="#00d2ff" font-size="10" font-weight="800" letter-spacing="0.8">STEP 1: FULL EXTENSION</text>

  <g transform="translate(145, 75)">
    <circle cx="0" cy="18" r="9" fill="#00d2ff"/>
    <line x1="0" y1="27" x2="0" y2="78" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="-8" y2="145" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="8" y2="145" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Upper Arm pinned -->
    <line x1="0" y1="38" x2="16" y2="68" stroke="#60efff" stroke-width="4" stroke-linecap="round"/>
    <!-- Forearm hanging down (straight >150°) -->
    <line x1="16" y1="68" x2="16" y2="110" stroke="#00ff87" stroke-width="4" stroke-linecap="round"/>
    <!-- Dumbbell -->
    <rect x="10" y="108" width="12" height="7" rx="2" fill="#ff9d2b"/>
    <!-- Angle badge -->
    <rect x="24" y="76" width="30" height="15" rx="3" fill="#111827" stroke="#00d2ff" stroke-width="0.8"/>
    <text x="39" y="87" fill="#00d2ff" font-size="8" font-weight="700" text-anchor="middle">&gt;150°</text>
  </g>
  <text x="24" y="96" fill="#e6edf3" font-size="10.5" font-weight="600">• Stand tall, shoulders back</text>
  <text x="24" y="114" fill="#e6edf3" font-size="10.5" font-weight="600">• Pin elbows firmly to sides</text>
  <text x="24" y="132" fill="#e6edf3" font-size="10.5" font-weight="600">• Arms fully extended down</text>
  <text x="24" y="150" fill="#e6edf3" font-size="10.5" font-weight="600">• Palms facing forward</text>
  <rect x="24" y="214" width="228" height="22" rx="4" fill="rgba(255,255,255,0.04)"/>
  <text x="138" y="229" fill="#8b949e" font-size="9.5" text-anchor="middle">Setup: Relaxed arms at bottom</text>

  <!-- Right: Peak Contraction -->
  <rect x="278" y="44" width="248" height="202" rx="8" fill="url(#bc_panel)" stroke="rgba(0,255,135,0.3)" stroke-width="1"/>
  <rect x="288" y="54" width="135" height="20" rx="4" fill="rgba(0, 255, 135, 0.15)"/>
  <text x="293" y="68" fill="#00ff87" font-size="10" font-weight="800" letter-spacing="0.8">STEP 2: PEAK SQUEEZE</text>

  <g transform="translate(410, 75)">
    <circle cx="0" cy="18" r="9" fill="#00ff87"/>
    <line x1="0" y1="27" x2="0" y2="78" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="-8" y2="145" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="8" y2="145" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Upper Arm pinned -->
    <line x1="0" y1="38" x2="16" y2="68" stroke="#60efff" stroke-width="4" stroke-linecap="round"/>
    <!-- Forearm curled up (<50°) -->
    <line x1="16" y1="68" x2="22" y2="34" stroke="#00ff87" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Dumbbell at top -->
    <rect x="16" y="28" width="12" height="7" rx="2" fill="#ff9d2b"/>
    <!-- Upward arrow -->
    <path d="M36,68 A16,16 0 0,0 36,44 M32,48 L36,43 L40,48" fill="none" stroke="#00ff87" stroke-width="2"/>
    <!-- Angle badge -->
    <rect x="24" y="6" width="30" height="15" rx="3" fill="#111827" stroke="#00ff87" stroke-width="1"/>
    <text x="39" y="17" fill="#00ff87" font-size="8.5" font-weight="800" text-anchor="middle">&lt;50°</text>
  </g>
  <text x="288" y="96" fill="#e6edf3" font-size="10.5" font-weight="600">• Curl weight without swing</text>
  <text x="288" y="114" fill="#e6edf3" font-size="10.5" font-weight="600">• Elbows stay glued to ribs</text>
  <text x="288" y="132" fill="#e6edf3" font-size="10.5" font-weight="600">• 1-second squeeze at top</text>
  <text x="288" y="150" fill="#e6edf3" font-size="10.5" font-weight="600">• 2-sec slow descent</text>
  <rect x="288" y="214" width="228" height="22" rx="4" fill="rgba(0,255,135,0.08)"/>
  <text x="402" y="229" fill="#00ff87" font-size="9.5" font-weight="700" text-anchor="middle">Execution: Lower fully before next rep</text>
</svg>